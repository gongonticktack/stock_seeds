<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>株ピック記録</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="site-header">
  <div class="palette-stripe" aria-hidden="true">
    <span class="s1"></span><span class="s2"></span><span class="s3"></span><span class="s4"></span>
  </div>
  <div class="header-inner">
    <h1>株ピック記録</h1>
    <p class="header-sub">バリュー／株主優待 スクリーニング履歴</p>
  </div>
</header>

<main>
  <section class="summary" id="summary" aria-label="集計">
    <div class="summary-item"><span class="summary-num" id="count-runs">–</span><span class="summary-label">ラン</span></div>
    <div class="summary-item"><span class="summary-num" id="count-picks">–</span><span class="summary-label">ピック</span></div>
    <div class="summary-item"><span class="summary-num" id="count-jp">–</span><span class="summary-label">日本株</span></div>
    <div class="summary-item"><span class="summary-num" id="count-us">–</span><span class="summary-label">米国株</span></div>
    <div class="summary-item"><span class="summary-num" id="count-shown">–</span><span class="summary-label">表示中</span></div>
  </section>

  <section class="controls" aria-label="検索と絞り込み">
    <input type="search" id="search" placeholder="検索（銘柄名・ブランド・ティッカー）" autocomplete="off">
    <select id="filter-kind" aria-label="絞り込み">
      <option value="">すべて</option>
      <option value="value">バリュー</option>
      <option value="yutai">優待</option>
      <option value="JP">日本株</option>
      <option value="US">米国株</option>
    </select>
  </section>

  <p class="status-msg" id="status-msg" hidden></p>
  <div id="runs"></div>
</main>

<footer>
  <p>データ： Supabase（stock_pick_runs / stock_picks）</p>
</footer>

<script src="app.js"></script>
</body>
</html>
